<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>DOOM</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #000; overflow: hidden; }
  canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    object-fit: contain; image-rendering: pixelated; background: #000;
  }
  /* Iconos arriba a la derecha: siempre visibles, discretos */
  #tools {
    position: fixed; top: 10px; right: 12px; z-index: 11;
    display: flex; gap: 8px; opacity: .45;
  }
  #tools:hover { opacity: 1; }
  #tools button {
    width: 36px; height: 36px; padding: 7px;
    background: rgba(10,10,10,.8); color: #999;
    border: 1px solid #444; cursor: pointer;
  }
  #tools button:hover { color: #ffb301; border-color: #ffb301; }
  #tools svg { width: 100%; height: 100%; fill: none; stroke: currentColor;
               stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #switch {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 6px; opacity: 0; transition: opacity .3s;
    pointer-events: none;
  }
  #switch.show { opacity: 1; pointer-events: auto; }
  #switch button {
    background: rgba(10,10,10,.8); color: #999; border: 1px solid #444;
    font-family: system-ui, sans-serif; font-size: 11px; letter-spacing: 1px;
    padding: 5px 10px; cursor: pointer;
  }
  #switch button.active { color: #ffb301; border-color: #ffb301; }
  #switch button:hover { color: #fff; border-color: #fff; }
  /* Pantalla de carga */
  #loader {
    position: fixed; inset: 0; z-index: 20; background: #000;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px;
    font-family: system-ui, sans-serif; color: #ffb301;
  }
  #loader.hide { display: none; }
  #loader .t { font-size: 28px; letter-spacing: 6px; color: #e33; }
  #loader .bar { width: min(60vw, 420px); height: 14px; border: 1px solid #7a1f14; }
  #loader .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7a1f14, #ffb301); }
  #loader .pct { font-size: 14px; letter-spacing: 2px; color: #999; }
</style>
</head>
<body>
<canvas id="canvas" width="640" height="400"
  oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
<div id="loader">
  <div class="t">DOOM</div>
  <div class="bar"><div class="fill" id="loadfill"></div></div>
  <div class="pct" id="loadpct">CARGANDO...</div>
</div>
<div id="switch">
  <button data-wad="doom.wad">DOOM 1 ULTIMATE</button>
  <button data-wad="doom2.wad">DOOM 2</button>
  <button data-wad="plutonia.wad">PLUTONIA</button>
  <button data-wad="tnt.wad">TNT</button>
</div>
<div id="tools">
  <button id="t-save" title="Guardar partida (F2)">
    <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
  </button>
  <button id="t-load" title="Cargar partida (F3)">
    <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
  </button>
  <button id="t-music" title="Musica on/off">
    <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  </button>
  <button id="t-full" title="Pantalla completa">
    <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
  </button>
</div>
<script>
  var params = new URLSearchParams(location.search);
  var WAD = params.get('wad') || 'doom.wad';
  var KNOWN = ['doom.wad', 'doom2.wad', 'plutonia.wad', 'tnt.wad', 'doom1.wad'];
  if (KNOWN.indexOf(WAD) < 0) WAD = 'doom.wad';

  // Selector: se muestra al mover el mouse o tocar teclas, se oculta solo.
  var sw = document.getElementById('switch'), swTimer = null;
  document.querySelectorAll('#switch button[data-wad]').forEach(function (b) {
    if (b.dataset.wad === WAD) b.classList.add('active');
    b.addEventListener('click', function () {
      if (b.dataset.wad !== WAD) location.search = '?wad=' + b.dataset.wad;
    });
  });
  function pokeSwitch() {
    sw.classList.add('show');
    clearTimeout(swTimer);
    swTimer = setTimeout(function () { sw.classList.remove('show'); }, 5000);
  }
  window.addEventListener('mousemove', pokeSwitch);
  window.addEventListener('keydown', pokeSwitch);
  window.addEventListener('touchstart', pokeSwitch);
  pokeSwitch();
  // Manda una tecla de funcion al juego (keydown + keyup).
  function sendKey(key, code, keyCode) {
    var opts = { key: key, code: code, keyCode: keyCode, which: keyCode,
                 bubbles: true, cancelable: true };
    window.dispatchEvent(new KeyboardEvent('keydown', opts));
    setTimeout(function () {
      window.dispatchEvent(new KeyboardEvent('keyup', opts));
    }, 80);
  }
  document.getElementById('t-save').addEventListener('click', function () {
    sendKey('F2', 'F2', 113);
  });
  document.getElementById('t-load').addEventListener('click', function () {
    sendKey('F3', 'F3', 114);
  });
  // Musica on/off EN VIVO (sin recargar): usa el puente web_audio.c.
  // El SetMusicVolume del juego no pega en este build (queda en 128),
  // asi que fijamos 48 directo al mixer; 0 = mute.
  var musicBtn = document.getElementById('t-music');
  var MUSIC_ON_VOL = 48;
  function musicOff() {
    try { return localStorage.getItem('doomMusic') === 'off'; }
    catch (e) { return false; }
  }
  function paintMusic() { musicBtn.style.opacity = musicOff() ? '.35' : '1'; }
  function applyMusic() {
    if (typeof Module._DG_MusicVolume !== 'function') return;
    try { Module._DG_MusicVolume(musicOff() ? 0 : MUSIC_ON_VOL); } catch (e) {}
  }
  paintMusic();
  // Aplica cuando el mixer ya levanto, y re-afirma el mute (el juego
  // re-escribe el volumen al pausar/cambiar de tema).
  setTimeout(applyMusic, 8000);
  setInterval(function () { if (musicOff()) applyMusic(); }, 3000);
  musicBtn.addEventListener('click', function () {
    try { localStorage.setItem('doomMusic', musicOff() ? 'on' : 'off'); }
    catch (e) {}
    applyMusic();
    paintMusic();
  });
  document.getElementById('t-full').addEventListener('click', function () {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else {
        var el = document.documentElement;
        var p = el.requestFullscreen();
        if (p && p.catch) p.catch(function (e) { console.log('full denegado:', e); });
      }
    } catch (e) { console.log('full error:', e); }
  });

  var Module = {
    arguments: ['-iwad', '/' + WAD],
    canvas: document.getElementById('canvas'),
    setStatus: function (text) {
      // "Downloading data... (hechos/total)" -> barra de progreso.
      var m = /Downloading data\.\.\. \((\d+)\/(\d+)\)/.exec(text || '');
      var pct = document.getElementById('loadpct');
      var fill = document.getElementById('loadfill');
      if (m) {
        var p = Math.round(100 * parseInt(m[1], 10) / parseInt(m[2], 10));
        if (pct) pct.textContent = 'CARGANDO... ' + p + '%';
        if (fill) fill.style.width = p + '%';
      } else if (pct && !/Running/.test(text || '')) {
        pct.textContent = (text || 'CARGANDO...').toUpperCase().slice(0, 60);
      }
    },
    onRuntimeInitialized: function () {
      // El motor ya corre: ocultar loader tras los primeros frames.
      setTimeout(function () {
        document.getElementById('loader').classList.add('hide');
      }, 2500);
    },
    preRun: [function () {
      // Solo montajes sincronicos: el .data aun no esta extraido aca.
      try { FS.mkdir('/persist'); } catch (e) {}
      FS.mount(IDBFS, {}, '/persist');
      FS.chdir('/persist');
      ENV['TIMIDITY_CFG'] = '/gus/timidity.cfg';
      FS.syncfs(true, function () {});
    }],
    preMain: [function () {
      // Aca el .data YA esta extraido: sembrar cfg/s si faltan.
      try { FS.stat('/persist/timidity.cfg'); }
      catch (e) {
        FS.writeFile('/persist/timidity.cfg', FS.readFile('/gus/timidity.cfg'));
      }
      try { FS.stat('/persist/default.cfg'); }
      catch (e) {
        var mv = '3';
        try { mv = localStorage.getItem('doomMusic') === 'off' ? '0' : '3'; }
        catch (err) {}
        FS.writeFile('/persist/default.cfg',
          'timidity_cfg_path "/gus/timidity.cfg"\n' +
          'music_volume ' + mv + '\n' +
          'sfx_volume 8\n');
      }
    }]
  };
  setInterval(function () {
    if (typeof FS !== 'undefined') FS.syncfs(false, function () {});
  }, 30000);
  window.addEventListener('pagehide', function () {
    if (typeof FS !== 'undefined') FS.syncfs(false, function () {});
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
